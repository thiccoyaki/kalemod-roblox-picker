name: Daily Roblox picks

on:
  schedule:
    - cron: "17 0 * * *"   # 8:17am Cebu time, every day
  workflow_dispatch:
    inputs:
      reset:
        description: "Reset picked history (everyone becomes eligible again)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pull comments and pick
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p data
          set -o pipefail
          python -u picker.py ${{ inputs.reset && '--reset' || '' }} 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(TZ=Asia/Manila date +%H:%M:%S)" "$line"; done | tee data/last_run.log

      - name: Commit results
        if: always()
        run: |
          git config user.name "kalemod-picker"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data picks
          git add -A data picks
          git diff --cached --quiet || git commit -m "Picks for $(TZ=Asia/Manila date +%F)"
          git pull --rebase -q || true
          git push
