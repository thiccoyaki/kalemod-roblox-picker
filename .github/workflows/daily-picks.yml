name: Daily Roblox picks

on:
  schedule:
    - cron: "17 0 * * *"   # 8:17am Cebu time, every day
  workflow_dispatch:
    inputs:
      reset:
        description: "Reset picked history (everyone becomes eligible again)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pull comments and pick
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python picker.py ${{ inputs.reset && '--reset' || '' }}

      - name: Commit results
        run: |
          git config user.name "kalemod-picker"
          git config user.email "actions@users.noreply.github.com"
          git add data picks
          git diff --cached --quiet || git commit -m "Picks for $(TZ=Asia/Manila date +%F)"
          git push
